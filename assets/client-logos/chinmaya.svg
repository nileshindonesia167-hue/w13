    <text x="44" y="40" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="800" font-size="12" fill="#E85D04" letter-spacing="1">VIDYALAYA</text>
    <text x="44" y="52" font-family="'Arial', sans-serif" font-weight="700" font-size="8.5" fill="#9A3412" letter-spacing="0.8">KEEP SMILING • CHINMAYA MISSION</text>
