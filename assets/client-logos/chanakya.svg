<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70">
  <defs>
    <linearGradient id="chanakyaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <g transform="translate(10, 5)">
    <!-- Blue outer ring C -->
    <path d="M 42 12 A 22 22 0 1 0 42 48" fill="none" stroke="url(#chanakyaBlue)" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Central Globe grid circle -->
    <circle cx="30" cy="30" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <ellipse cx="30" cy="30" rx="14" ry="6" fill="none" stroke="#2563EB" stroke-width="1"/>
    <line x1="30" y1="16" x2="30" y2="44" stroke="#2563EB" stroke-width="1"/>
    <!-- Globe color grid segments -->
    <path d="M 18 26 A 14 14 0 0 1 30 16 L 30 30 Z" fill="#DC2626" opacity="0.8"/>
    <path d="M 30 16 A 14 14 0 0 1 42 26 L 30 30 Z" fill="#2563EB" opacity="0.8"/>
    <path d="M 30 30 L 42 34 A 14 14 0 0 1 30 44 Z" fill="#16A34A" opacity="0.8"/>
    <path d="M 30 30 L 30 44 A 14 14 0 0 1 18 34 Z" fill="#CA8A04" opacity="0.8"/>

    <!-- Yellow Flame Swoosh on the right -->
    <path d="M 44 22 C 52 28, 54 38, 48 46 C 53 40, 50 30, 44 22 Z" fill="url(#flameGrad)"/>

    <!-- Typography -->
    <text x="62" y="28" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#1E3A8A" letter-spacing="1">CHANAKYA</text>
    <text x="62" y="44" font-family="'Arial', sans-serif" font-weight="700" font-size="8.5" fill="#2563EB" letter-spacing="0.3">The Global School for Intellectuals</text>
  </g>
