<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70">
  <g transform="translate(10, 5)">
    <!-- Outer concentric orange circles -->
    <circle cx="30" cy="30" r="28" fill="#FFFDF8" stroke="#D97328" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="25" fill="none" stroke="#E28532" stroke-width="1.2"/>
    
    <!-- Sunburst & rays -->
    <path d="M 20 22 Q 30 14 40 22 Z" fill="#E8862C"/>
    <line x1="30" y1="12" x2="30" y2="8" stroke="#E8862C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="14" x2="19" y2="10" stroke="#E8862C" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="38" y1="14" x2="41" y2="10" stroke="#E8862C" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="16" y1="20" x2="12" y2="18" stroke="#E8862C" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="44" y1="20" x2="48" y2="18" stroke="#E8862C" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Wheat stalks -->
    <path d="M 17 28 C 14 22 18 16 20 18 C 18 22 19 26 21 29 Z" fill="#D97328"/>
    <path d="M 43 28 C 46 22 42 16 40 18 C 42 22 41 26 39 29 Z" fill="#D97328"/>
    
    <!-- Blue Monogram SB -->
    <text x="30" y="32" font-family="'Arial Black', sans-serif" font-weight="900" font-size="19" fill="#1D70B8" text-anchor="middle" letter-spacing="-1">SB</text>
    
    <!-- Bottom line under SB -->
    <rect x="18" y="34" width="24" height="2" fill="#1D70B8" rx="1"/>

    <!-- Brand Name Text -->
    <text x="70" y="27" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" fill="#D97328" letter-spacing="0.5">SUNBLESS FOODS</text>
    <text x="70" y="42" font-family="'Arial', sans-serif" font-weight="700" font-size="9" fill="#92400E" letter-spacing="0.2">INTERNATIONAL PVT. LTD.</text>
  </g>
</svg>
