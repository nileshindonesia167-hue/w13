<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70">
  <g transform="translate(10, 5)">
    <!-- Golden Pinstripe Box Background -->
    <rect x="5" y="5" width="40" height="50" fill="#FEFCE8" rx="2" stroke="#15803D" stroke-width="1.2"/>
    <g stroke="#EAB308" stroke-width="1" opacity="0.6">
      <line x1="10" y1="5" x2="10" y2="55"/>
      <line x1="14" y1="5" x2="14" y2="55"/>
      <line x1="18" y1="5" x2="18" y2="55"/>
      <line x1="22" y1="5" x2="22" y2="55"/>
      <line x1="26" y1="5" x2="26" y2="55"/>
      <line x1="30" y1="5" x2="30" y2="55"/>
      <line x1="34" y1="5" x2="34" y2="55"/>
      <line x1="38" y1="5" x2="38" y2="55"/>
